<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Fornecedores V2</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
}

button{
background:#17365d;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:5px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:8px;
}
</style>

</head>

<body>

<div class="container">

<div class="card">
<h2>Cadastro de Fornecedores</h2>

<label>Código</label>
<input id="codigoFornecedor">

<label>Nome</label>
<input id="nomeFornecedor">

<button onclick="salvarFornecedor()">
Salvar Fornecedor
</button>

</div>

<div class="card">

<h2>Fornecedores Cadastrados</h2>

<table>

<thead>
<tr>
<th>Código</th>
<th>Nome</th>
</tr>
</thead>

<tbody id="listaFornecedores">

</tbody>

</table>

</div>

</div>

<script>

const supabase = window.supabase.createClient(
'https://gpwyfjqvyslwolpsukfm.supabase.co',
'sb_publishable_K5ST_DKSg7qI5b3kJ7by1A_HrddCjVk'
);

async function carregarFornecedores(){

const { data, error } = await supabase
.from('fornecedores')
.select('*')
.order('id');

if(error){
console.error(error);
alert(error.message);
return;
}

const lista =
document.getElementById('listaFornecedores');

lista.innerHTML='';

data.forEach(item=>{

lista.innerHTML += `
<tr>
<td>${item.codigo}</td>
<td>${item.nome}</td>
</tr>
`;

});

}

async function salvarFornecedor(){

const codigo =
document.getElementById('codigoFornecedor').value;

const nome =
document.getElementById('nomeFornecedor').value;

if(!codigo || !nome){
alert('Preencha código e nome');
return;
}

const { error } = await supabase
.from('fornecedores')
.insert({
codigo:codigo,
nome:nome
});

if(error){
console.error(error);
alert(error.message);
return;
}

alert('Fornecedor salvo');

document.getElementById('codigoFornecedor').value='';
document.getElementById('nomeFornecedor').value='';

carregarFornecedores();

}

carregarFornecedores();

</script>

</body>
</html>
